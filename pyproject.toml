[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-filing-intelligence"
version = "0.1.0"
description = "Download traceable SEC filings for financial analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sec-filing = "sec_filing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

